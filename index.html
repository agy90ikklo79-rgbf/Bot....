<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع البوت الخاص بي</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #23272a; /* لون ديسكورد */
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #2c2f33;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        }
        h1 { color: #5865F2; }
        p { font-size: 18px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background-color: #5865F2;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #4752C4; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 مرحباً بك في موقع البوت الرسمي!</h1>
        <p>هذا الموقع تم إنشاؤه واستضافته مجاناً 24 ساعة من الهاتف.</p>
        <a href="https://discord.com" target="_blank" class="btn">إضافة البوت للسيرفر</a>
    </div>

</body>
</html>
